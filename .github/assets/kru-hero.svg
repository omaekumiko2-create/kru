<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">KRU — Key Relay Unit</title>
  <desc id="desc">A local credential relay for AI agents, shown beside the KRU desktop interface.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#262626" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans{font-family:"Arial Narrow","Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Mono",Consolas,monospace}.ink{fill:#262626}.muted{fill:#666361}.paper{fill:#fbfaf9}.chassis{fill:#ebe9e7}.orange{fill:#ed4a1a}.displayText{fill:#f4fcfc}.line{stroke:#8d8a88;stroke-width:1}.softLine{stroke:#bbb6b2;stroke-width:1}.small{font-size:13px;letter-spacing:2px}.tiny{font-size:10px;letter-spacing:1.4px}.body{font-size:18px}.title{font-size:112px;font-weight:300;letter-spacing:8px}.seven{font-family:"Cascadia Mono",Consolas,monospace;font-size:82px;font-weight:300;letter-spacing:-8px}
    </style>
  </defs>

  <rect width="1400" height="820" fill="#ebe9e7"/>
  <rect width="1400" height="8" fill="#262626"/>
  <rect y="8" width="216" height="5" fill="#ed4a1a"/>

  <g transform="translate(74 78)">
