      <rect x="224" y="62" width="21" height="21" fill="#fbfaf9" stroke="#8d8a88"/><text x="234.5" y="76" text-anchor="middle" class="muted">B</text><rect x="253" y="69" width="6" height="6" fill="#8d8a88"/><text x="271" y="72" class="muted" font-size="7">LOG</text><text x="271" y="84" class="ink" font-size="11" font-weight="700">AUDIT</text>
      <rect x="403" y="62" width="21" height="21" fill="#fbfaf9" stroke="#8d8a88"/><text x="413.5" y="76" text-anchor="middle" class="muted">C</text><rect x="432" y="69" width="6" height="6" fill="#8d8a88"/><text x="450" y="72" class="muted" font-size="7">SYSTEM</text><text x="450" y="84" class="ink" font-size="11" font-weight="700">SET</text>
