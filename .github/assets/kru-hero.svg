        <rect x="323" y="45" width="73" height="34" fill="#5e605f"/><text x="359.5" y="66" text-anchor="middle" class="mono paper" font-size="9" font-weight="700">CHECK</text><rect x="404" y="45" width="78" height="34" class="paper" stroke="#bbb6b2"/><text x="443" y="66" text-anchor="middle" class="mono ink" font-size="9">EDIT</text>
