      <text x="145" y="213" class="displayText seven">0005</text><text x="357" y="213" fill="#f4fcfc" font-size="11">ITEM</text>
      <text x="159" y="244" fill="#f4fcfc" font-size="11">▶ READY</text><rect x="224" y="228" width="60" height="23" class="orange"/><text x="254" y="244" text-anchor="middle" class="paper" font-size="9">ALL ON</text>
      <text x="452" y="131" fill="#383838" font-size="8">LAST USE</text><text x="446" y="174" class="displayText" font-size="34">OK</text><text x="461" y="191" fill="#f4fcfc" font-size="8">CHECK</text>
