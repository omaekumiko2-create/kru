<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">KRU — Key Relay Unit</title>
  <desc id="desc">KRU is a tiny, free, no-account, cross-platform password vault and input tool for AI agents.</desc>
  <style>
    .sans{font-family:Bahnschrift,"Segoe UI Variable","Segoe UI",Arial,sans-serif}
    .mono{font-family:"Cascadia Mono",Consolas,monospace}
    .instrument{font-family:"Arial Narrow",Bahnschrift,"Segoe UI",sans-serif}
    .ink{fill:#262626}.muted{fill:#666361}.paper{fill:#fbfaf9}.orange{fill:#ed4a1a}
    .displayText{fill:#eef9f6}.displayMuted{fill:#747b77}.ghost{fill:#242725}
    .rule{stroke:#8d8a88;stroke-width:1}.softRule{stroke:#bbb6b2;stroke-width:1}
  </style>

  <rect width="1400" height="720" fill="#ebe9e7"/>
  <rect width="1400" height="8" fill="#262626"/>
  <rect y="8" width="220" height="5" class="orange"/>

  <g transform="translate(72 58)">
    <rect y="5" width="9" height="9" class="orange"/>
    <text x="26" y="15" class="mono ink" font-size="13" font-weight="700" letter-spacing="3">K.R.U.</text>
    <line x1="116" y1="10" x2="194" y2="10" class="rule"/>
    <text x="212" y="15" class="mono muted" font-size="10" letter-spacing="2">KEY RELAY UNIT</text>
    <text x="1256" y="15" text-anchor="end" class="mono muted" font-size="10" letter-spacing="2">LOCAL / STDIO</text>
  </g>

  <g transform="translate(72 120)">
    <text y="108" class="sans ink" font-size="116" font-weight="300" letter-spacing="8">KRU</text>
    <line x1="276" y1="18" x2="276" y2="112" class="rule"/>
    <text x="318" y="54" class="sans ink" font-size="35" font-weight="600">A MODULAR PASSWORD VAULT</text>
    <text x="318" y="102" class="sans ink" font-size="35" font-weight="600">AND INPUT TOOL FOR AI AGENTS.</text>
    <g transform="translate(1032 14)">
      <text class="mono muted" font-size="9" letter-spacing="1.4">WINDOWS APP</text>
      <text y="39" class="instrument ink" font-size="38" font-weight="300">8.55</text>
      <text x="88" y="38" class="mono muted" font-size="10">MiB</text>
      <line y1="55" x2="152" y2="55" class="softRule"/>
      <text y="78" class="mono muted" font-size="9" letter-spacing="1.4">PORTABLE ZIP / 3.84 MiB</text>
    </g>
  </g>

  <g transform="translate(0 278)">
    <rect width="1400" height="262" fill="#0d0e0e"/>
    <rect x="12" y="12" width="1376" height="238" fill="none" stroke="#1d201e"/>

    <g transform="translate(42 40)" class="mono">
      <g>
        <rect width="30" height="30" class="paper"/>
        <text x="15" y="20" text-anchor="middle" class="ink" font-size="13">A</text>
        <text x="45" y="19" class="displayText" font-size="11">REQUEST</text>
        <rect x="124" y="11" width="7" height="7" fill="#ea1f11"/>
      </g>
      <g transform="translate(0 47)">
        <rect width="30" height="30" class="paper"/>
        <text x="15" y="20" text-anchor="middle" class="ink" font-size="13">B</text>
        <text x="45" y="19" class="displayText" font-size="11">RELAY</text>
        <rect x="124" y="11" width="7" height="7" fill="#ea1f11"/>
      </g>
      <g transform="translate(0 94)">
        <rect width="30" height="30" class="paper"/>
        <text x="15" y="20" text-anchor="middle" class="ink" font-size="13">C</text>
        <text x="45" y="19" class="displayText" font-size="11">ACTION</text>
        <rect x="124" y="11" width="7" height="7" fill="#4a71a4"/>
      </g>
    </g>

    <g transform="translate(250 43)">
      <text x="90" class="mono displayMuted" font-size="9" letter-spacing="2">01 / AGENT</text>
      <text x="90" y="64" class="instrument displayText" font-size="42" font-weight="300">REQUEST</text>
      <text x="90" y="92" class="mono displayMuted" font-size="9" letter-spacing="1.2">FIELD NAME + ACTION</text>

      <line x1="310" y1="61" x2="396" y2="61" stroke="#ed4a1a"/>
      <path d="M396 61l-10-6v12z" class="orange"/>

      <text x="448" class="mono displayMuted" font-size="9" letter-spacing="2">02 / KRU</text>
      <rect x="448" y="26" width="198" height="58" class="orange"/>
      <text x="547" y="66" text-anchor="middle" class="mono paper" font-size="25" font-weight="700" letter-spacing="4">LOCAL</text>
      <text x="448" y="106" class="mono displayText" font-size="9" letter-spacing="1.2">USES ENCRYPTED VALUE</text>

      <line x1="696" y1="61" x2="782" y2="61" stroke="#ed4a1a"/>
      <path d="M782 61l-10-6v12z" class="orange"/>

      <text x="834" class="mono displayMuted" font-size="9" letter-spacing="2">03 / TARGET</text>
      <text x="834" y="64" class="instrument displayText" font-size="42" font-weight="300">DONE</text>
      <text x="834" y="92" class="mono displayMuted" font-size="9" letter-spacing="1.2">BROWSER · SSH · API · CLI</text>

      <g transform="translate(90 151)" class="mono">
        <text class="displayText" font-size="11">▶ READY</text>
        <rect x="78" y="-15" width="122" height="24" class="orange"/>
        <text x="139" y="1" text-anchor="middle" class="paper" font-size="9" letter-spacing="1">NO PLAINTEXT</text>
        <text x="224" class="displayMuted" font-size="9" letter-spacing="1.2">AGENT CONTEXT REMAINS CLEAN</text>
      </g>
    </g>

    <g transform="translate(1244 177)">
      <rect y="21" width="7" height="14" class="orange"/>
      <rect x="14" y="8" width="7" height="27" class="orange"/>
      <rect x="28" width="7" height="35" class="orange"/>
      <rect x="42" y="14" width="7" height="21" class="orange"/>
      <rect x="56" y="5" width="7" height="30" fill="#4a71a4"/>
      <rect x="70" y="23" width="7" height="12" class="ghost"/>
      <rect x="84" y="12" width="7" height="23" class="ghost"/>
      <text x="45" y="52" text-anchor="middle" class="mono displayMuted" font-size="7" letter-spacing="1">ON DEMAND</text>
    </g>
  </g>

  <g transform="translate(72 584)">
    <g class="mono" font-size="11" font-weight="700">
      <rect width="190" height="48" class="orange"/>
      <text x="95" y="30" text-anchor="middle" class="paper">UNDER 10 MB</text>
      <rect x="202" width="190" height="48" class="paper" stroke="#bbb6b2"/>
      <text x="297" y="30" text-anchor="middle" class="ink">OPEN SOURCE</text>
      <rect x="404" width="190" height="48" fill="#5e605f"/>
      <text x="499" y="30" text-anchor="middle" class="paper">NO ACCOUNT</text>
      <rect x="606" width="262" height="48" class="paper" stroke="#bbb6b2"/>
      <text x="737" y="30" text-anchor="middle" class="ink">WIN · MAC · LINUX</text>
    </g>
    <g transform="translate(930 17)" class="mono" font-size="9" letter-spacing="1.5">
      <text class="orange">01</text><text x="32" class="ink">CONNECT</text>
      <text x="116" class="orange">02</text><text x="148" class="ink">SAVE ONCE</text>
      <text x="250" class="orange">03</text><text x="282" class="ink">HAND OFF</text>
    </g>
    <line y1="72" x2="1256" y2="72" class="softRule"/>
    <rect y="84" width="1256" height="3" class="orange"/>
  </g>
</svg>
