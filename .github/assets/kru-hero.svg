      <rect x="18" y="194" width="28" height="28" fill="#fbfaf9"/><text x="32" y="213" text-anchor="middle" fill="#262626" font-size="14">C</text><text x="58" y="211" fill="#f4fcfc" font-size="11">HTTP</text><rect x="109" y="203" width="7" height="7" fill="#4a71a4"/>
      <text x="145" y="132" fill="#383838" font-size="9" letter-spacing="2">PAGE A</text>
