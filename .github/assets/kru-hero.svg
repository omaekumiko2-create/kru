    <text x="6" y="264" class="sans ink" font-size="32" font-weight="600">AGENTS KEEP WORKING.</text>

    <line x1="6" y1="310" x2="444" y2="310" class="line"/>
    <path d="M6 310v22m438-22v22" fill="none" class="line"/>
    <text x="6" y="368" class="sans muted body">A small, open-source relay for the final</text>
    <text x="6" y="398" class="sans muted body">authentication step—without putting hidden</text>
    <text x="6" y="428" class="sans muted body">credentials into the agent conversation.</text>

    <g transform="translate(6 498)">
