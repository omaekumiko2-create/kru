name: Portable release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: node --test browser-extension/service-worker.test.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - run: npm run portable
      - name: Verify archive checksum
        shell: pwsh
        run: |
          Push-Location dist
          try {
            $checksumFiles = @(Get-ChildItem -Filter '*.sha256')
            if ($checksumFiles.Count -eq 0) { throw "No checksum files were produced" }
            $checksumFiles | ForEach-Object {
              $parts = (Get-Content -LiteralPath $_.FullName -Raw).Trim() -split '\s+', 2
              if ($parts.Count -ne 2) { throw "Invalid checksum file: $($_.Name)" }
              $archive = $parts[1]
              if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Missing archive: $archive" }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
              if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Checksum mismatch: $archive" }
            }
          } finally {
            Pop-Location
          }
      - name: Verify packaged Windows application
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem dist -Filter '*-portable.zip')
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows portable archive." }
          & scripts/verify-portable-windows.ps1 -Archive $archives[0].FullName
      - run: node scripts/smoke-gui.mjs src-tauri/target/release/kru.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  macos:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_P8_BASE64 \
            KEYCHAIN_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/kru-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | \
            openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          cert_info="$(security find-identity -v -p codesigning "$keychain_path" | \
            grep 'Developer ID Application:' | head -n 1)"
          signing_identity="$(awk -F'"' '{print $2}' <<<"$cert_info")"
          test -n "$signing_identity"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "Imported signing identity: $signing_identity"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | \
            openssl base64 -d -A -out "$api_key_path"
          test -s "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Build and sign macOS application
        run: npm run build:mac
      - name: Notarize and staple macOS application
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/notarize-macos.sh src-tauri/target/release/bundle/macos/KRU.app
      - name: Verify signed and notarized macOS application
        run: |
          app_path="src-tauri/target/release/bundle/macos/KRU.app"
          signature_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          grep -Fq "Authority=Developer ID Application:" <<<"$signature_details"
          grep -Fq "runtime" <<<"$signature_details"
          grep -Fq "Timestamp=" <<<"$signature_details"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - run: node scripts/smoke-gui.mjs src-tauri/target/release/bundle/macos/KRU.app/Contents/MacOS/kru
      - name: Package notarized macOS application
        env:
          KRU_REQUIRE_DEVELOPER_ID: '1'
        run: npm run portable:mac
      - name: Verify archive checksum
        run: (cd dist && shasum -a 256 -c *.sha256)
      - name: Verify packaged macOS application
        env:
          KRU_REQUIRE_NOTARIZED: '1'
        run: |
          archives=(dist/*-portable.zip)
          test ${#archives[@]} -eq 1
          bash scripts/verify-portable-unix.sh "${archives[0]}" macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Remove Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kru-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  linux-gui:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system packages
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libssl-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf libxdo-dev xvfb xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: rm -rf src-tauri/target/release/bundle/appimage
      - run: npm run build:linux
      - name: Smoke AppImage CLI and MCP
        run: |
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          test ${#appimages[@]} -eq 1
          APPIMAGE_EXTRACT_AND_RUN=1 node scripts/smoke-cli.mjs "${appimages[0]}"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node scripts/smoke-gui.mjs "${appimages[0]}"
      - run: npm run portable:linux
      - name: Verify archive checksum
        run: (cd dist && sha256sum -c *.sha256)
      - name: Verify packaged Linux GUI application
        run: |
          archives=(dist/*-portable.tar.gz)
          test ${#archives[@]} -eq 1
          bash scripts/verify-portable-unix.sh "${archives[0]}" linux-gui
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gui-portable
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256

  linux-headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npm run build:headless
      - run: node scripts/smoke-cli.mjs src-tauri/target/release/kru
      - run: npm run portable:headless
      - name: Verify archive checksum
        run: (cd dist && sha256sum -c *.sha256)
      - name: Verify packaged Linux headless application
        run: |
          archives=(dist/*.tar.gz)
          test ${#archives[@]} -eq 1
          bash scripts/verify-portable-unix.sh "${archives[0]}" linux-headless
      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux-gui, linux-headless]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "KRU $GITHUB_REF_NAME"
